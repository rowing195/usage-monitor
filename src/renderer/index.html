<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Orb. The ring's colour identifies the source, so it carries no label. -->
    <div id="orb" class="hidden">
      <svg viewBox="0 0 76 76">
        <circle class="ring-track" cx="38" cy="38" r="27" />
        <circle id="ring" class="ring-value" cx="38" cy="38" r="27" />
      </svg>
      <div class="readout">
        <span id="orb-pct">--</span>
      </div>
    </div>

    <!-- Collapsed nub -->
    <div id="nub" class="hidden">
      <svg id="nub-svg" viewBox="0 0 16 60" preserveAspectRatio="none">
        <polygon id="nub-shape" points="16,1 16,59 3,52 3,8" />
        <line id="nub-line" x1="9" y1="52" x2="9" y2="8" />
      </svg>
    </div>

    <!-- Panel -->
    <div id="panel" class="hidden">
      <header>
        <h1 id="panel-title">Usage Monitor</h1>
        <button id="settings-toggle" title="設定">⚙</button>
      </header>

      <div id="view-metrics" class="view">
        <ul id="metrics"></ul>
        <p id="empty" class="empty hidden">還沒有任何資料。</p>
      </div>

      <div id="view-settings" class="view hidden">
        <div class="field">
          <label for="statusline-action">Claude statusline <span id="statusline-value" class="field-value"></span></label>
          <button id="statusline-action" class="field-button"></button>
          <p class="field-hint" id="statusline-hint"></p>
        </div>
        <div class="field">
          <label for="standby-ms">待機時間 <span id="standby-value" class="field-value"></span></label>
          <input id="standby-ms" type="range" min="1000" max="30000" step="1000" />
          <p class="field-hint">沒有動作多久後轉為半透明</p>
        </div>
        <div class="field">
          <label for="idle-opacity">待機透明度 <span id="idle-value" class="field-value"></span></label>
          <input id="idle-opacity" type="range" min="10" max="100" step="5" />
        </div>
        <div class="field">
          <label for="collapse-ms">收合時間 <span id="collapse-value" class="field-value"></span></label>
          <input id="collapse-ms" type="range" min="1000" max="30000" step="1000" />
          <p class="field-hint">沒有動作多久後重新判斷吸附</p>
        </div>
        <button id="quit" class="danger-button">結束 Usage Monitor</button>
      </div>

      <footer>
        <button id="open-claude">開啟 claude.ai 用量頁</button>
      </footer>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
