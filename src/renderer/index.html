<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Orb. The ring's colour identifies the source, so it carries no label. -->
    <div id="orb" class="hidden">
      <!-- Dial graduations, drawn unrotated because 0% already sits at the top.
           Only the instrument theme shows them. The two threshold marks take
           their colour from the orb's own severity class, so nothing here needs
           re-rendering when the figure moves. -->
      <svg class="ticks" viewBox="0 0 76 76">
        <line class="tick major" x1="38" y1="6" x2="38" y2="3" />
        <line class="tick" x1="56.81" y1="12.11" x2="58.57" y2="9.68" />
        <line class="tick" x1="68.44" y1="28.11" x2="71.29" y2="27.18" />
        <line class="tick" x1="68.44" y1="47.89" x2="71.29" y2="48.82" />
        <line class="tick" x1="56.81" y1="63.89" x2="58.57" y2="66.32" />
        <line class="tick major" x1="38" y1="70" x2="38" y2="73" />
        <line class="tick" x1="19.19" y1="63.89" x2="17.43" y2="66.32" />
        <line class="tick tick-70" x1="7.56" y1="47.89" x2="4.71" y2="48.82" />
        <line class="tick tick-80" x1="7.56" y1="28.11" x2="4.71" y2="27.18" />
        <line class="tick tick-90" x1="19.19" y1="12.11" x2="17.43" y2="9.68" />
      </svg>
      <svg viewBox="0 0 76 76">
        <circle class="ring-track" cx="38" cy="38" r="27" />
        <!-- Chases the live ring on a slower, linear transition, so a figure that
             jumps leaves a trail behind it. Hidden unless a theme asks for it. -->
        <circle id="ring-ghost" class="ring-ghost" cx="38" cy="38" r="27" />
        <circle id="ring" class="ring-value" cx="38" cy="38" r="27" />
      </svg>
      <div class="readout">
        <span id="orb-pct">--</span>
      </div>
    </div>

    <!-- Collapsed nub -->
    <div id="nub" class="hidden">
      <svg id="nub-svg" viewBox="0 0 16 60" preserveAspectRatio="none">
        <polygon id="nub-shape" points="16,1 16,59 3,52 3,8" />
        <line id="nub-line" x1="9" y1="52" x2="9" y2="8" />
      </svg>
    </div>

    <!-- Panel -->
    <div id="panel" class="hidden">
      <header>
        <h1 id="panel-title">Usage Monitor</h1>
        <button id="settings-toggle" title="設定">⚙</button>
      </header>

      <div id="view-metrics" class="view">
        <ul id="metrics"></ul>
        <p id="empty" class="empty hidden">還沒有任何資料。</p>
      </div>

      <div id="view-settings" class="view hidden">
        <div class="field">
          <label>風格 <span id="theme-value" class="field-value"></span></label>
          <div id="theme-picker" class="theme-picker">
            <button type="button" class="theme-option" data-theme="wood">
              <span class="theme-swatch swatch-wood"></span>
              木質
            </button>
            <button type="button" class="theme-option" data-theme="gauge">
              <span class="theme-swatch swatch-gauge"></span>
              儀器
            </button>
            <button type="button" class="theme-option" data-theme="crt">
              <span class="theme-swatch swatch-crt"></span>
              磷光
            </button>
          </div>
        </div>
        <div class="field">
          <label for="statusline-action">Claude statusline <span id="statusline-value" class="field-value"></span></label>
          <button id="statusline-action" class="field-button"></button>
          <p class="field-hint" id="statusline-hint"></p>
        </div>
        <div class="field">
          <label for="autostart-toggle">
            開機自動啟動
            <span class="switch">
              <input id="autostart-toggle" type="checkbox" disabled />
              <span class="switch-track"></span>
            </span>
          </label>
          <p class="field-hint" id="autostart-hint"></p>
        </div>
        <div class="field">
          <label for="standby-ms">待機時間 <span id="standby-value" class="field-value"></span></label>
          <input id="standby-ms" type="range" min="1000" max="30000" step="1000" />
          <p class="field-hint">沒有動作多久後轉為半透明</p>
        </div>
        <div class="field">
          <label for="idle-opacity">待機透明度 <span id="idle-value" class="field-value"></span></label>
          <input id="idle-opacity" type="range" min="10" max="100" step="5" />
        </div>
        <div class="field">
          <label for="collapse-ms">收合時間 <span id="collapse-value" class="field-value"></span></label>
          <input id="collapse-ms" type="range" min="1000" max="30000" step="1000" />
          <p class="field-hint">沒有動作多久後重新判斷吸附</p>
        </div>
        <button id="quit" class="danger-button">結束 Usage Monitor</button>
      </div>

      <footer>
        <button id="open-claude">開啟 claude.ai 用量頁</button>
      </footer>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
